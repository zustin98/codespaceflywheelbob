# Vérification automatique : à chaque "push", GitHub compile le code et lance les tests.
# Résultat : un crochet vert (réussi) ou un X rouge (échec) à côté du commit.
name: Compilation et tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler et tester
        run: ./gradlew build --console=plain
